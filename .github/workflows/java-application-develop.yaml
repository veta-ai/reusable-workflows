name: CI - Snapshot Deploy (Java Application)

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '21'

      terraform-version:
        required: false
        type: string
        default: '1.9.6'

      sonar_project_key:
        required: false
        type: string

      scan-vulnerabilities:
        description: 'Whether to scan the Docker image for vulnerabilities using Trivy'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Test
    uses: ./.github/workflows/build-java-maven.yaml
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}
      sonar_project_key: ${{ inputs.sonar_project_key }}
  
  deploy-artifact:
    name: Deploy Artifact to Nexus
    uses: ./.github/workflows/deploy-java-maven-snapshot.yaml
    needs: [build]
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}

  create-docker-image:
    name: Create Docker Image
    uses: ./.github/workflows/create-docker-image.yaml
    needs: [build]
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}
      scan-vulnerabilities: ${{ inputs.scan-vulnerabilities }}

  deploy-argo-cd:
    name: Deploy to Argo CD
    uses: ./.github/workflows/deploy-argo-cd.yaml
    needs: [create-docker-image]
    secrets: inherit
    with:
      namespace: 'dev'
      image-docker: ${{ needs.create-docker-image.outputs.image_docker }}

  # apply-terraform:
