name: Deploy Argo CD

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
        
      image-docker:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  deploy-argo-cd:
    name: Deploy Argo CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Clone Infra Repo and Update Image Tag
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/${{ vars.organization }}/infra-k8s-deployments.git
          cd infra-k8s-deployments/apps/${{ github.repository }}/${{ inputs.namespace }}
          sed -i "s|image: .*|image: ${{ inputs.image-docker }} |" deployment.yaml
          git config --global user.name "CI Bot"
          git config --global user.email "ci@github.com"
          git add deployment.yaml
          git commit -m "chore(deploy): update image tag to ${{ inputs.image-docker }} for namespace ${{ inputs.namespace }}"
          git push