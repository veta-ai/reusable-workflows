name: Build & Test Java Project (Maven)

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '21'

      sonar_project_key:
        required: false
        type: string

      type_application:
        required: false
        type: string
        default: 'java-library'
    
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: |
            [{
              "id": "nexus-releases",
              "username": "${{ secrets.NEXUS_USERNAME }}",
              "password": "${{ secrets.NEXUS_PASSWORD }}"
            }
            ,{
              "id": "nexus-snapshots",
              "username": "${{ secrets.NEXUS_USERNAME }}",
              "password": "${{ secrets.NEXUS_PASSWORD }}"
            }]
          repositories: |
            [{
              "id": "nexus-releases",
              "url": "http://18.223.125.35:8081/repository/maven-releases/",
              "releases": { "enabled": true },
              "snapshots": { "enabled": false }
            },
            {
              "id": "nexus-snapshots",
              "url": "http://18.223.125.35:8081/repository/maven-snapshots",
              "releases": { "enabled": false },
              "snapshots": { "enabled": true }
            }]
          mirrors: |
            [{
              "id": "nexus-snapshots",
              "name": "Nexus Snapshots",
              "mirrorOf": "nexus-snapshots",
              "url": "http://18.223.125.35:8081/repository/maven-snapshots/"
            },
            {
              "id": "nexus-releases",
              "name": "Nexus Releases",
              "mirrorOf": "nexus-releases",
              "url": "http://18.223.125.35:8081/repository/maven-releases/"
            }]

      # - name: Configure Maven settings.xml
      #   uses: s4u/maven-settings-action@v3.1.0    
      #   with:
      #     githubServer: false
      #     servers: |
      #       [{
      #         "id": "github",
      #         "username": "${{ github.actor }}",
      #         "password": "${{ secrets.GH_PACKAGES_TOKEN }}"
      #       }]
      #     repositories: |
      #       [{
      #         "id": "github",
      #         "url": "https://maven.pkg.github.com/veta-ai/veta-core-shared-libs",
      #         "releases": { "enabled": true },
      #         "snapshots": { "enabled": true }
      #       }]

      - name: Validate SNAPSHOT version
        id: extract_version
        if: startsWith(github.ref_name, 'feature/')
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Detected version: $VERSION"
          [[ "$VERSION" == *-SNAPSHOT ]] || (echo "ERROR: Version is not a SNAPSHOT!" && exit 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clean and Compile
        run: mvn clean compile

      - name: Run Checkstyle
        run: mvn clean checkstyle:check

      - name: Run Tests
        run: mvn clean test -T 1C

  integrated-tests:
    name: Integrated Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: |
            [{
              "id": "nexus-releases",
              "username": "${{ secrets.NEXUS_USERNAME }}",
              "password": "${{ secrets.NEXUS_PASSWORD }}"
            }
            ,{
              "id": "nexus-snapshots",
              "username": "${{ secrets.NEXUS_USERNAME }}",
              "password": "${{ secrets.NEXUS_PASSWORD }}"
            }]
          repositories: |
            [{
              "id": "nexus-releases",
              "url": "http://18.223.125.35:8081/repository/maven-releases/",
              "releases": { "enabled": true },
              "snapshots": { "enabled": false }
            },
            {
              "id": "nexus-snapshots",
              "url": "http://18.223.125.35:8081/repository/maven-snapshots",
              "releases": { "enabled": false },
              "snapshots": { "enabled": true }
            }]
          mirrors: |
            [{
              "id": "nexus-snapshots",
              "name": "Nexus Snapshots",
              "mirrorOf": "nexus-snapshots",
              "url": "http://18.223.125.35:8081/repository/maven-snapshots/"
            },
            {
              "id": "nexus-releases",
              "name": "Nexus Releases",
              "mirrorOf": "nexus-releases",
              "url": "http://18.223.125.35:8081/repository/maven-releases/"
            }]

      - name: Integrated Tests
        if: ${{ inputs.type_application }} == 'java-application'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean test -Dtest=**.integration.**.*

  run-sonar-test:
    name: Run SonarQube Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Configure Maven settings.xml
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: |
            [{
              "id": "nexus-releases",
              "username": "${{ secrets.NEXUS_USERNAME }}",
              "password": "${{ secrets.NEXUS_PASSWORD }}"
            }
            ,{
              "id": "nexus-snapshots",
              "username": "${{ secrets.NEXUS_USERNAME }}",
              "password": "${{ secrets.NEXUS_PASSWORD }}"
            }]
          repositories: |
            [{
              "id": "nexus-releases",
              "url": "http://18.223.125.35:8081/repository/maven-releases/",
              "releases": { "enabled": true },
              "snapshots": { "enabled": false }
            },
            {
              "id": "nexus-snapshots",
              "url": "http://18.223.125.35:8081/repository/maven-snapshots",
              "releases": { "enabled": false },
              "snapshots": { "enabled": true }
            }]
          mirrors: |
            [{
              "id": "nexus-snapshots",
              "name": "Nexus Snapshots",
              "mirrorOf": "nexus-snapshots",
              "url": "http://18.223.125.35:8081/repository/maven-snapshots/"
            },
            {
              "id": "nexus-releases",
              "name": "Nexus Releases",
              "mirrorOf": "nexus-releases",
              "url": "http://18.223.125.35:8081/repository/maven-releases/"
            }]

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify sonar:sonar -DsonarToken=$SONAR_TOKEN

  analysis-sonarqube:
    #    Essa exclusão acontece devido a nosso pacote gratuito do sonar que só permite a excução da branch main
    if: github.ref_name == 'main'
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: run-sonar-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Sonar Build Breaker
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        uses: jkumar19/sonar-build-breaker@v1.0.0
        with:
          sonar_url: "https://sonarcloud.io"
          sonar_branch: ${{ env.GITHUB_REF_NAME }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          project_key: ${{ inputs.sonar_project_key }}